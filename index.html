<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horario Espiritual</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Horario">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar"><h1 id="title">Hoy</h1></header>
  <main id="view"></main>
  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="hoy" class="active">Hoy</button>
    <button data-tab="mes">Mes</button>
    <button data-tab="config">Configuración</button>
  </nav>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-sheet="cancel"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="grabber" aria-hidden="true"></div>
      <p id="sheet-msg"></p>
      <div class="sheet-actions">
        <button class="secondary" data-sheet="cancel">Cancelar</button>
        <button class="primary" id="sheet-ok" data-sheet="ok">Aceptar</button>
      </div>
    </div>
  </div>
  <div id="toast" role="status" hidden></div>
</div>
<input type="file" id="file-import" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
